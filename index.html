<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaGen Polaroid</title>
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="stylesheet" href="/instagram.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            hand: ['Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'cursive', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#E76F51',
              secondary: '#F4A261',
              accent: '#FFB5BA',
            },
            surface: {
              base: '#FDF8F5',
              card: '#FFFFFF',
              muted: '#F5F5F4',
              modal: '#FDF8F5',
            },
            text: {
              main: '#1F2937',
              muted: '#6B7280',
              inverse: '#FFFFFF',
            },
            border: {
              default: '#E5E5E5',
              focus: '#E76F51',
            },
            status: {
              success: '#95D5B2',
              error: '#E63946',
              warning: '#FFE066',
              info: '#74C0FC',
            },
            // Legacy colors (keep for backward compatibility until full migration)
            'camera-body': '#FDF6E3',
            'camera-accent': '#E6C2A8',
            'camera-dark': '#2D2D2D',
          },
          animation: {
            'eject': 'ejectPhoto 5s cubic-bezier(0.23, 1, 0.32, 1) forwards',
            'develop': 'developPhoto 6s ease-in-out forwards',
            'ping-slow': 'pingSlow 2.25s cubic-bezier(0, 0, 0.2, 1) infinite',
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            'scale-in': 'scaleIn 0.3s ease-out forwards',
            'border-beam': 'borderBeam 2s linear infinite',
            'flashlight': 'flashlight 0.3s ease-out',
            'gravity-spin': 'gravitySpin 3s cubic-bezier(0.5, 0, 0.5, 1) infinite',
            'slide-down': 'slideDown 0.3s ease-out forwards',
          },
          keyframes: {
            ejectPhoto: {
              '0%': { transform: 'translateY(0) scale(0.9)', opacity: '0' },
              '30%': { transform: 'translateY(-60px) scale(0.95)', opacity: '0.7' },
              '100%': { transform: 'translateY(-320px) scale(1)', opacity: '1' },
            },
            developPhoto: {
              '0%': { filter: 'blur(15px) grayscale(50%) brightness(0.9)' },
              '100%': { filter: 'blur(0px) grayscale(0%) brightness(1)' },
            },
            pingSlow: {
              '0%': { transform: 'scale(1)', opacity: '0.5' },
              '50%': { transform: 'scale(2)', opacity: '0' },
              '100%': { transform: 'scale(2)', opacity: '0' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.9)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            borderBeam: {
              '0%': { backgroundPosition: '0% 50%' },
              '100%': { backgroundPosition: '200% 50%' },
            },
            gravitySpin: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          }
        },
      },
    }
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      /* Prevent scroll on drag */
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
      background-size: 20px 20px;
      background-color: #f3f4f6;
    }

    /* Hide scrollbar for gallery */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Prevent ghost image when dragging photos */
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
